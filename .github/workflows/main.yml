name: 전자정부프레임워크를 사용하여 빌드 및 배포

on:
  push:
    branches:
      - main  #주석 : main 브랜치에 push가 되면 actions가 동작함

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 11 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Maven으로 war 빌드
        run: mvn -B clean package

      - name: SSH 키 준비
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: war 파일 EC2로 전송
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no \
            target/hello-1.0.0.war ubuntu@${{ secrets.EC2_HOST }}:/tmp/

      - name: EC2에서 Tomcat 재배포
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo systemctl stop tomcat
            rm -rf /opt/tomcat/webapps/ROOT /opt/tomcat/webapps/ROOT.war
            cp /tmp/hello-1.0.0.war /opt/tomcat/webapps/ROOT.war
            sudo systemctl start tomcat
          EOF
