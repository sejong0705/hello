name: self-hosted runner 빌드 및 배포

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, kosa-label]
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 11 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Maven으로 war 빌드
        run: mvn -B clean package

      - name: Docker 이미지 빌드
        run: docker build -t hello:latest .

  deploy:
    needs: build
    runs-on: [self-hosted, kosa-label]
    steps:
      - name: 컨테이너 교체
        run: |
          docker stop hello || true
          docker rm hello || true
          docker run -d --name hello --network host --restart always hello:latest
          docker image prune -f
